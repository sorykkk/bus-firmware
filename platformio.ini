[platformio]
default_envs = node_a_sim, node_a_gps, node_b_cam

[env]
platform = espressif32@^6.5.0
framework = arduino
lib_ldf_mode = deep
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
extra_scripts = pre:tools/prepare_fs.py
; test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DDEFAULT_ROUTE_ID=7
  -DDEFAULT_BUS_ID=420
  -Wno-unused-variable

[node_a]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<node_a/>
; files from env/ packed into the LittleFS image ("src:dst" renames on the device)
custom_fs_files = config.ini node_a/.env:secrets.env node_a/route.json:route.json node_a/scenarios.json:scenarios.json
; test_ignore = test_camera, test_logic_*

[env:node_a_sim]
extends = node_a
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  ${env.build_flags}
  -DUSE_SIM_GPS

[env:node_a_gps]
extends = node_a
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
  mikalhart/TinyGPSPlus@^1.0.3
build_flags =
  ${env.build_flags}
  -DUSE_REAL_GPS

[env:node_b_cam]
board = esp32cam
build_src_filter = -<*> +<node_b/>
custom_fs_files = config.ini node_b/.env:secrets.env
; test_ignore = test_ble, test_logic_*
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env:native]
platform = native
framework =
build_flags = -std=gnu++17
; test_ignore = test_wifi, test_ble, test_camera
build_src_filter = -<*>
