; Per device-pair configuration (Node A beacon + Node B camera of the same bus).
; Uploaded to the ESP32 flash (LittleFS) with:  `pio run -e <env> -t uploadfs`
; Secrets (Wi-Fi, server URL, HMAC key) live in env/node_a/.env and env/node_b/.env, never here.

[identity]
route_id = 7
bus_id   = 101
; NVS overrides from the serial console (`set bus N`) win over these; `clear id` removes them.

[ble]
; iBeacon UUID = "our system". The app filters scans on it: must match the app's constant.
system_uuid = d22b117c-2f6e-4d74-9e9f-6f09213c3dd0
; RSSI a phone measures at 1 m from the beacon. Calibrate on the real bus.
tx_power_1m = -59
; dBm: -12 -9 -6 -3 0 3 6 9. Lower keeps the bubble inside the bus.
radio_power_dbm = 3
adv_interval_ms = 150
; A signed proof-of-presence token rotates at this period. The app reports it to the server.
token_slot_s = 30

[timing]
telemetry_interval_ms = 2000
frame_default_interval_ms = 10000

[pins]
; BOOT button on most ESP32 dev boards
button = 0
gps_rx = 16
gps_tx = 17
gps_baud = 9600

[sim]
; Scenario started at boot; empty = the "default" entry of env/node_a/scenarios.json.
scenario =

[camera]
; QVGA VGA SVGA XGA HD SXGA UXGA
frame_size = SVGA
; 10-63, lower = better quality and bigger file
jpeg_quality = 12
vflip = false
hmirror = false
; Built-in white LED on GPIO 4 lit during capture (night shots, very bright!)
flash = false
